name: Publish to PyPI

# Trusted publishing (OIDC): PyPI project "exportcomments" trusts this
# repository + this workflow file name. No API token is stored anywhere.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build and publish (e.g. v2.2.0)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for PyPI trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Smoke-import the wheel
        run: |
          python -m pip install dist/*.whl
          python -c "import exportcomments, sys; print('ok', exportcomments.installed_version())"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
